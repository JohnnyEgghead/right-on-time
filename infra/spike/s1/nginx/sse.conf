# Spike S1: nginx in front of the Next.js SSE route, as D1 rules. TLS on 443 with a
# self-signed certificate made on the temporary server (no domain); http2 on, as on
# the locked server's default.conf.
upstream web {
    server web:3000;
    keepalive 16;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/spike.crt;
    ssl_certificate_key /etc/nginx/certs/spike.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;

    # The SSE route: no response buffering, no cache, and a read timeout well past the
    # 15 s heartbeat (the 60 s default would cut a quiet stream without heartbeats).
    location = /api/v1/events {
        proxy_pass http://web;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Control for the instrument only: the same route with nginx buffering forced on and
    # the app's X-Accel-Buffering header ignored. The load script expects this stream to
    # stall, which shows the measurement detects buffering.
    location = /control/buffered-events {
        rewrite ^ /api/v1/events break;
        proxy_pass http://web;
        proxy_buffering on;
        proxy_ignore_headers X-Accel-Buffering;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://web;
    }
}
