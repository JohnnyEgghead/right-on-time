# Spike S1 (G-S1-SSE): proxy, web and db on a TEMPORARY Lightsail instance only.
# Never run on the locked server. Same nginx and postgres pins as infra/hosted/compose.yaml.
# The postgres password is made on the server by setup.sh (/etc/bw-spike/db.env); never in git.
name: bw-spike-s1

services:
  proxy:
    image: nginx:1.30.6@sha256:66b50d24288dba67f3d000b31223daefc4868c58d29aaacb6a4ff9771597b5eb
    restart: unless-stopped
    ports:
      - "${BW_SPIKE_PORT:-443}:443"
    volumes:
      - ./nginx/sse.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
    mem_limit: 64m

  web:
    build: ./app
    image: bw-spike-s1-web:local
    restart: unless-stopped
    env_file:
      - ${BW_SPIKE_ENV:-/etc/bw-spike/db.env}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m

  db:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    restart: unless-stopped
    env_file:
      - ${BW_SPIKE_ENV:-/etc/bw-spike/db.env}
    environment:
      POSTGRES_USER: brightwater
      POSTGRES_DB: brightwater
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightwater -d brightwater"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
