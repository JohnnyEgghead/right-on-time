# Spike S2 (G-S2-TWA-OFFLINE): THROWAWAY route, included inside the 443 server block of
# infra/spike/s2/nginx/default.conf. Everything under /spike/s2/ goes to the spike container.
# The upstream is resolved per request (Docker DNS, a variable in proxy_pass), so nginx starts and
# reloads even when the spike container is down: then only /spike/s2/ answers 502.
location = /spike/s2 {
    return 301 /spike/s2/;
}

location ^~ /spike/s2/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $spike_s2_upstream http://spike-s2:8080;
    client_max_body_size 30m;
    proxy_request_buffering on;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass $spike_s2_upstream;
}
