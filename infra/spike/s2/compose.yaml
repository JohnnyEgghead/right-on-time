# Spike S2 (G-S2-TWA-OFFLINE): THROWAWAY receiver, its own Compose project (brightwater-spike-s2),
# kept apart from the product services. It joins the brightwater project's network so nginx can
# reach it as "spike-s2". Image: the node image the stack already pins (no new pull, no npm deps).
# Run from /opt/brightwater-spike-s2:  docker compose -p brightwater-spike-s2 up -d
name: brightwater-spike-s2

services:
  spike-s2:
    image: node:26.12.1-bookworm-slim@sha256:88e480776c6149ff1d098cd304f44bf18057fb5d284a3329b78162d29821e28c
    restart: unless-stopped
    user: "1000:1000"
    command: ["node", "/app/server.mjs"]
    environment:
      PORT: "8080"
      DATA_DIR: /data
    volumes:
      - /opt/brightwater-spike-s2/app:/app:ro
      - /opt/brightwater-spike-s2/data:/data
    expose:
      - "8080"
    read_only: true
    mem_limit: 96m
    networks:
      brightwater:
        aliases:
          - spike-s2

networks:
  brightwater:
    external: true
    name: brightwater_default
