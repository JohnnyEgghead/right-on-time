# Spike S3 (G-S3-MAP-SAFARI): THROWAWAY Compose override for the brightwater project's proxy only.
# Used ONLY as: docker compose -f compose.yaml -f /opt/brightwater-spike-s3/proxy-override.yaml up -d --no-deps proxy
# Compose merges volumes by container path, so this replaces only the default.conf mount (the spike
# copy adds 1 include line) and adds the read-only include directory. Teardown runs
# "docker compose up -d --no-deps proxy" with compose.yaml alone, which restores the original mount.
services:
  proxy:
    volumes:
      - /opt/brightwater-spike-s3/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/brightwater-spike-s3/nginx/locations.conf:/etc/nginx/spike-s3/locations.conf:ro
