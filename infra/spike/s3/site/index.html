<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'none'; form-action 'none'">
<title>Spike S3 map</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
  html, body { margin: 0; height: 100%; background: #f4f1ea; font: 16px/1.4 -apple-system, system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #bar { position: absolute; left: 8px; right: 8px; top: 8px; z-index: 2; background: rgba(255,255,255,.92);
         border-radius: 8px; padding: 8px 12px; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  #bar b { font-weight: 700; }
  #hosts { font-size: 14px; word-break: break-all; }
</style>
</head>
<body>
<div id="bar">
  <div>Spike S3 map of Columbus. Zoom: <b id="zoom">-</b>. Tiles drawn: <b id="status">waiting</b></div>
  <div id="hosts">Hosts seen: -</div>
  <div>Blocked requests to other hosts: <b id="blocked">0</b> <span id="blockedWhat"></span></div>
</div>
<div id="map"></div>
<script src="vendor/pmtiles.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
