# Spike S5 (G-S5-HOST): the lock, over TLS. Port 80 serves only the ACME
# webroot (certbot HTTP-01 issue and renewal) and redirects everything else
# to https. Port 443 answers every path with the placeholder page, except
# /healthz, which proxies to the placeholder web container so the whole
# stack is exercised. The certificate comes from the letsencrypt volume.
server {
    listen 80 default_server;
    server_name bw.j7l.io _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://bw.j7l.io$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name bw.j7l.io _;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/bw.j7l.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bw.j7l.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:2m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # SPIKE S3 (G-S3-MAP-SAFARI): the only added directive; teardown remounts infra/hosted/nginx/default.conf.
    include /etc/nginx/spike-s3/locations.conf;

    location = /healthz {
        proxy_pass http://web:3000/;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/placeholder;
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }
}
