# Spike S3 (G-S3-MAP-SAFARI): THROWAWAY file server inside the spike container (nginx 1.30.6, the
# image the stack already pins). Serves /spike/s3/ from /srv; Range requests are answered by nginx
# itself (206 Partial Content) for the static PMTiles file.
log_format s3 '$time_iso8601 $status "$request" range="$http_range" sent=$body_bytes_sent ua="$http_user_agent"';

server {
    listen 8080;
    access_log /var/log/spike/access.log s3;
    server_tokens off;
    root /srv;
    gzip off;
    add_header Cache-Control "no-store" always;

    location = /spike/s3/ {
        try_files /index.html =404;
    }

    location /spike/s3/ {
        alias /srv/;
        types {
            text/html html;
            text/css css;
            text/javascript js mjs;
            application/octet-stream pmtiles;
        }
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "no-store" always;
    }
}
