# Spike S3 (G-S3-MAP-SAFARI): THROWAWAY route, included inside the 443 server block of
# infra/spike/s3/nginx/default.conf. Everything under /spike/s3/ goes to the spike's own nginx
# container (static page, vendored libraries, columbus.pmtiles). Range headers pass through, so the
# 206 answers come from the file server and show in this proxy's access log too.
# The upstream is resolved per request (Docker DNS), so the proxy starts even when the spike is down.
location = /spike/s3 {
    return 301 /spike/s3/;
}

location ^~ /spike/s3/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $spike_s3_upstream http://spike-s3:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    proxy_pass $spike_s3_upstream;
}
