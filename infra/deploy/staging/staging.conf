# G-IPHONE-WEB: the staging copy's site file (infra/deploy/staging.sh), picked by PROXY_CONF=staging.conf on the temporary staging
# server only. staging.sh copies it into that server's nginx folder; it is never in infra/nginx, so the hosted server never gets it.
# hosted.conf with 2 changes: port 80 redirects to the name the request came in on ($host), not bw.j7l.io (the locked hosted demo),
# and the certificate is the staging name's own Let's Encrypt certificate (certbot --cert-name staging). Routes: ROUTES=open.
include /etc/nginx/bw/http.conf;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log bw;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log bw;

    ssl_certificate     /etc/letsencrypt/live/staging/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:2m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security $bw_hsts always;

    include /etc/nginx/bw-routes.conf;
}
