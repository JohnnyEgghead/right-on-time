# P1-DEPLOY: the lock (ROUTES=locked, the hosted server until P8-UNLOCK). It lives in nginx, not
# in the web image, so an image deployed before release cannot open the demo: /healthz reaches
# the web container (the uptime monitor and the deploy check need the real answer, and a dead
# web shows as 502, never as the page); every other path gets the placeholder page from nginx.
# P8-UNLOCK switches the hosted server to ROUTES=open.
# F-101 (P2-KERNEL): the placeholder answers with the 11.5 security headers, and its style sheet
# is a file of its own, so the CSP (no inline style) holds for it.
# F-214: the 502 of /healthz while web is down carries the 11.5 headers too.
include /etc/nginx/bw/proxied-headers.conf;
location = /healthz {
    proxy_pass http://bw_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
}

location = /placeholder.css {
    root /usr/share/nginx/placeholder;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/bw/security-headers.conf;
}

location / {
    root /usr/share/nginx/placeholder;
    try_files /index.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/bw/security-headers.conf;
}
