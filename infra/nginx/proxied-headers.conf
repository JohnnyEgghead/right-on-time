# F-214: the security headers of SPECIFICATIONS 11.5 on the answers nginx itself makes in a proxied location (a 502 or
# 504 when the web container is down or not found, a 413 for a body over the limit). Included once at server level by
# each routes file, so every location with no add_header of its own inherits it (the proxied ones; a file location adds
# its own, security-headers.conf). A web answer already carries these headers from the kernel or the page guard (a page
# CSP holds its nonce), so each value here is empty when the web answer sent that header, and add_header sends nothing
# (the maps in http.conf): nginx never doubles or replaces a header of the web process. HSTS is not here: hosted.conf
# adds it at server level for every proxied answer, and an own copy on plain HTTP sends none.
add_header Content-Security-Policy $bw_own_csp always;
add_header X-Content-Type-Options $bw_own_nosniff always;
add_header Referrer-Policy $bw_own_referrer always;
