# P1-DEPLOY: http-level settings every site file includes first (hosted.conf, local.conf,
# bootstrap.conf). SPECIFICATIONS section 11.4: nginx logs the request method and a mapped URI
# in which every token segment of /m/, /r/, /inbox/, /email/, /set-password/ and /book/done/ is
# replaced by :token; query strings are not logged. The log format below carries no client
# address, no Referer (a referring URL can hold a token) and no user agent; the error log is
# held at crit (F-97, below), where nginx's per-request error lines are not written.

# Docker's embedded DNS. The upstream re-resolves "web" when the container is recreated with a
# new address (every deploy and every rollback recreates it), and nginx starts even before the
# web container exists.
resolver 127.0.0.11 valid=2s ipv6=off;
# F-1592: a lookup that fails with SERVFAIL or a timeout (while web is down, Docker's DNS forwards "web" upstream)
# keeps the old address and is retried only after resolver_timeout, 30 s by default: up to about 30 s of 502 after a
# restart moved web to a new address. 3 s bounds that window.
resolver_timeout 3s;

# F-97: the error log of every request this proxy serves. nginx writes the raw request line ("request: GET
# /m/<token>?<query>"), the client address and the host on each [error] line (an upstream that refuses, times out
# or is not resolved), which section 11.4 says is never logged. At crit nginx drops those lines; the access log
# still records each such request with its status (502, 504) and the mapped URI. The base image's main-level
# error_log (notice, to stderr) stays for start-up and reload messages, which carry no request.
error_log /var/log/nginx/error.log crit;

upstream bw_web {
    zone bw_web 64k;
    server web:3000 resolve;
    keepalive 16;
    # F-884: nginx closes an idle upstream connection first. The web process keeps its side open longer (apps/web/src/server.ts KEEP_ALIVE_MS,
    # 65 s), so nginx never reuses a connection Node just closed (a 502, "upstream prematurely closed connection").
    keepalive_timeout 55s;
}

# $request_uri is the raw request line target; drop the query string first.
map $request_uri $bw_path {
    "~^(?<path>[^?]*)" $path;
}

# Then replace the token segment after each token route prefix: the 11.4 page prefixes, and the API link-token
# routes (P5-INBOX: API-120 and API-121 /api/v1/inbox/{inboxToken}/...; F-611: API-166 /api/v1/emails/{oneTimeToken}, API-167 and API-168 /api/v1/password-tokens/{passwordToken}; API-114 /api/v1/public/bookings/{bookingToken};
# infra/tests/nginx.test.ts checks every link-token row of the contract table against this map).
map $bw_path $bw_log_uri {
    "~^/(?<route>m|r|inbox|email|set-password|book/done|api/v1/inbox|api/v1/emails|api/v1/password-tokens|api/v1/public/bookings)/[^/]+(?<rest>.*)$" /$route/:token$rest;
    default $bw_path;
}

# HSTS on the hosted origin (SPECIFICATIONS 11.5, F-101): only an HTTPS response carries it; an
# empty value makes add_header send nothing (own copies on plain HTTP).
map $scheme $bw_hsts {
    https   "max-age=31536000";
    default "";
}

# The browser's scheme for X-Forwarded-Proto (F-304). nginx's own scheme, except that a front proxy in the same
# private network (loopback or a private address: the CI rig's https front, ci/auth-stack/tls-front.ts) may say https
# for a connection it terminated. A public peer's header is ignored.
geo $remote_addr $bw_front {
    default         0;
    127.0.0.0/8     1;
    10.0.0.0/8      1;
    172.16.0.0/12   1;
    192.168.0.0/16  1;
}
map "$bw_front:$http_x_forwarded_proto" $bw_proto {
    "1:https" https;
    default   $scheme;
}

log_format bw escape=json '{"time":"$time_iso8601","method":"$request_method","uri":"$bw_log_uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
