# P1-DEPLOY: the open routes (ROUTES=open: own copies, and the hosted server from P8-UNLOCK on).
# Everything goes to the web container; the skeleton web process itself still answers the
# placeholder for every route but /healthz.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $bw_proto;
# The kernel's rate limits count per client address (SPECIFICATIONS 7.1): nginx overwrites the header
# with the peer it sees, so a client cannot choose its own address. The web port is reachable only
# through nginx (compose.yaml: expose, never published).
proxy_set_header X-Forwarded-For $remote_addr;

location = /healthz {
    proxy_pass http://bw_web;
}

# The event stream (SPECIFICATIONS section 7.3 API-09, SD-13), folded in from spike S1
# (infra/spike/s1/nginx/sse.conf, G-S1-SSE PASS): no response buffering, no cache, and a read
# timeout well past the 15 s heartbeat (the 60 s default would cut a quiet stream). The route
# is built (API-09, packages/api-server/src/events), served by the web process's kernel.
# gzip off (finding F-61): nginx never compresses the stream, whatever Accept-Encoding the
# browser sends. The app side is met: the kernel path skips Next.js (so its gzip never applies)
# and answers Cache-Control no-cache, no-transform. The browser-header load proof stays with
# F-61's testkit deferral.
location = /api/v1/events {
    proxy_pass http://bw_web;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 1h;
}

# P3-MAPS-BAKE (FR-MAP-1, API-106): the 3 per-branch map files, served from the map volume (MAPS_DIR, /data/maps) by
# nginx itself, with range requests (nginx answers 206 to a Range header on a static file; the client reads a PMTiles
# file by byte ranges). Only the 3 branch names match; any other /maps/ path goes to the web container. gzip stays off:
# the tiles are already compressed and a range is over the file's bytes. The file is a public map of public data, so it
# is open here; the locked file (ROUTES=locked) serves nothing but the placeholder.
location ~ ^/maps/(?<bw_map>columbus|dayton|springfield)\.pmtiles$ {
    alias /data/maps/$bw_map.pmtiles;
    default_type application/octet-stream;
    gzip off;
    add_header Cache-Control "public, max-age=86400" always;
    add_header Accept-Ranges "bytes" always;
    include /etc/nginx/bw/security-headers.conf;
}

# P3-ITEMS (API-103, SD-32): a photo upload is up to 10 MB of raw JPEG and a signature up to 512 KB of PNG; the kernel
# refuses a larger body with validation_failed (packages/api/src/contracts/tech.ts). nginx's 1 MB default would answer
# 413 first, so this 1 route takes 11 MB, and only through to the web process (no request buffering to disk).
location ~ ^/api/v1/tech/photos/ {
    client_max_body_size 11m;
    proxy_request_buffering off;
    proxy_pass http://bw_web;
}

location / {
    proxy_pass http://bw_web;
}
