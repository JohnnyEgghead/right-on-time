# Spike S5 (G-S5-HOST), kept by P1-DEPLOY: port-80-only lock, used only while
# infra/hosted/setup.sh obtains the first certificate (PROXY_CONF=bootstrap.conf), because
# hosted.conf cannot start without one. Static only: it needs no web container.
include /etc/nginx/bw/http.conf;

server {
    listen 80 default_server;
    server_name bw.j7l.io _;
    server_tokens off;
    access_log /var/log/nginx/access.log bw;

    # The 11.5 headers on every answer, as hosted.conf sends them (F-1795); a location that adds a header of its own repeats the include.
    include /etc/nginx/bw/security-headers.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        root /usr/share/nginx/placeholder;
        try_files /index.html =404;
        include /etc/nginx/bw/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
}
