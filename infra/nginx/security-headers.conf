# P2-KERNEL (F-101): the security headers of SPECIFICATIONS 11.5 on every response nginx itself
# serves (the locked placeholder now; the MAPS_DIR and PHOTOS_DIR files later). Included in each
# location that serves files: an add_header in a location replaces every inherited one, so the
# HSTS line is repeated here. $bw_hsts (http.conf) is set only on HTTPS, so an own copy on plain
# HTTP sends no HSTS. Responses from the web container carry the same CSP, nosniff and referrer
# policy from the kernel (packages/api-server/src/kernel/headers.ts); the CSP text is the same.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security $bw_hsts always;
