# P1-DEPLOY: an own copy's site (the default, PROXY_CONF unset): plain HTTP on port 80 inside the
# container, published on 127.0.0.1:8080 (APP_ORIGIN http://localhost:8080, SPECIFICATIONS 11.1).
include /etc/nginx/bw/http.conf;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log bw;

    include /etc/nginx/bw-routes.conf;
}
