# P1-DEPLOY: the hosted site (bw.j7l.io), selected by PROXY_CONF=hosted.conf in the server's
# .env. Port 80 serves only the ACME webroot (certbot HTTP-01 issue and renewal, from spike S5)
# and redirects everything else to https. Port 443 serves the routes file chosen by ROUTES
# (routes-locked.conf until P8-UNLOCK). The certificate comes from the letsencrypt volume.
include /etc/nginx/bw/http.conf;

server {
    listen 80 default_server;
    server_name bw.j7l.io _;
    server_tokens off;
    access_log /var/log/nginx/access.log bw;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://bw.j7l.io$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name bw.j7l.io _;
    server_tokens off;
    access_log /var/log/nginx/access.log bw;

    ssl_certificate     /etc/letsencrypt/live/bw.j7l.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bw.j7l.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:2m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS on the hosted origin (11.5, F-101) for every response a location adds no header to (the
    # proxied web answers); the locations that add their own repeat it (security-headers.conf).
    add_header Strict-Transport-Security $bw_hsts always;

    include /etc/nginx/bw-routes.conf;
}
